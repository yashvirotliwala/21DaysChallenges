<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 19 - Blog UI</title>
  <link rel="stylesheet" href="./assests/css/bootstrap.min.css">
  <link rel="stylesheet" href="assests/css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">InkVerse</div>
    <nav>
      <a href="#">Home</a>
      <a href="#blogContainer">Blogs</a>
      <a href="#">Trending</a>
      <a href="#">Contact</a>
    </nav>
    <button class="nav-btn">Subscribe</button>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Stories That Inspire Minds</h1>
      <p>Explore premium articles crafted for modern thinkers, creators, and dreamers.</p>
      <button>Read Latest</button>
    </div>
  </section>

  <!-- Search -->
   <div>
        <h2 class="text-center blog">Blogs</h2>
   </div>
  <section class="search-section">
    <input type="text" id="searchInput" placeholder="Search blog posts..." />
  </section>

  <!-- Blog Cards --> 
  <section class="blog-container" id="blogContainer"></section>

  <!-- Footer -->
  <footer>
    <p>© 2026 InkVerse Blog UI | Designed by You 🚀</p>
  </footer>

  <script src="assests/js/script.js"></script>
</body>
</html>
